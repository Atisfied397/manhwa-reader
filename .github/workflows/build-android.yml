name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "App URL (e.g. https://manhwa-reader.vercel.app)"
        required: true
        default: "https://manhwa-reader.vercel.app"
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Update Capacitor config URL
        run: |
          node -e "
          const fs = require('fs');
          const url = '${{ github.event.inputs.app_url || '' }}' || 'https://manhwa-reader.vercel.app';
          let config = fs.readFileSync('capacitor.config.ts', 'utf8');
          config = config.replace(
            /url:\s*process\.env\.NEXT_PUBLIC_APP_URL\s*\|\|\s*['\"].*?['\"]/,
            'url: \"' + url + '\"'
          );
          fs.writeFileSync('capacitor.config.ts', config);
          console.log('Updated URL to: ' + url);
          "

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ManhwaReader-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
